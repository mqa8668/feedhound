# Seed taxonomy for the Category table. 3 levels, >= 30 categories total.
# Each top-level entry is level 1; "children" are level 2; nested "children" are level 3.

- slug: electronics
  name: Electronics
  children:
    - slug: phones
      name: Phones
      priceBounds: {min: 500000, max: 80000000}
      children:
        - slug: iphone
          name: iPhone
          attributes:
            - {"key": "storage_gb", "label": "Storage", "kind": "number", "unit": "gb", "min": 64, "max": 2048, "keyAttr": true}
            - {"key": "battery_pct", "label": "Battery health", "kind": "number", "unit": "pct", "min": 1, "max": 100, "keyAttr": false}
            - {"key": "market", "label": "Market", "kind": "enum", "keyAttr": false, "values": ["vn", "ll", "zd", "za", "j", "ch", "kh"]}
        - slug: samsung
          name: Samsung
        - slug: xiaomi
          name: Xiaomi
        - slug: oppo
          name: OPPO
    - slug: laptops
      name: Laptops
      priceBounds: {min: 2000000, max: 150000000}
      children:
        - slug: macbook
          name: MacBook
          attributes:
            - {"key": "line", "label": "Line", "kind": "enum", "keyAttr": false, "values": ["air", "pro", "mini", "imac", "studio"]}
            - {"key": "chip", "label": "Chip", "kind": "ordered", "keyAttr": true, "values": ["m1", "m1_pro", "m1_max", "m1_ultra", "m2", "m2_pro", "m2_max", "m2_ultra", "m3", "m3_pro", "m3_max", "m3_ultra", "m4", "m4_pro", "m4_max", "m5", "m5_pro", "m5_max"]}
            - {"key": "ram_gb", "label": "RAM", "kind": "number", "unit": "gb", "min": 4, "max": 256, "keyAttr": true}
            - {"key": "ssd_gb", "label": "SSD", "kind": "number", "unit": "gb", "min": 128, "max": 8192, "keyAttr": true}
            - {"key": "screen_in", "label": "Screen", "kind": "number", "unit": "in", "min": 11, "max": 32, "keyAttr": false}
            - {"key": "battery_pct", "label": "Battery health", "kind": "number", "unit": "pct", "min": 1, "max": 100, "keyAttr": false}
            - {"key": "warranty_months", "label": "Warranty", "kind": "number", "unit": "months", "min": 0, "max": 36, "keyAttr": false}
        - slug: windows-laptop
          name: Windows Laptop
        - slug: gaming-laptop
          name: Gaming Laptop
    - slug: tablets
      name: Tablets
      children:
        - slug: ipad
          name: iPad
        - slug: android-tablet
          name: Android Tablet
    - slug: audio
      name: Audio
      children:
        - slug: earbuds
          name: Earbuds
        - slug: headphones
          name: Headphones
        - slug: speakers
          name: Speakers
    - slug: wearables
      name: Wearables
      children:
        - slug: smartwatch
          name: Smartwatch
        - slug: fitness-band
          name: Fitness Band

