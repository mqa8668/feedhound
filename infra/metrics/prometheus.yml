# infra/metrics/prometheus.yml. Only loaded when the
# `prometheus` service runs (docker compose --profile metrics ...).
global:
  scrape_interval: 30s

scrape_configs:
  - job_name: api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:4820"]

  - job_name: agent
    metrics_path: /metrics
    static_configs:
      - targets: ["agent:4821"]

  - job_name: bot
    metrics_path: /metrics
    static_configs:
      - targets: ["bot:4822"]
